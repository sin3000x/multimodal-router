<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Multimodal Router · 多式联运路径评估台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Multimodal Router</h1>
      <span class="subtitle">全球多式联运路径计算与咽喉绕行评估服务</span>
    </div>
    <div class="topbar-right">
      <div class="theme-switch" role="group" aria-label="主题切换">
        <button type="button" class="theme-btn" data-theme="light">浅色</button>
        <button type="button" class="theme-btn" data-theme="dark">深色</button>
        <button type="button" class="theme-btn" data-theme="system">系统</button>
      </div>
      <div id="health-badge" class="health-badge">加载中…</div>
    </div>
  </header>

  <main class="layout">
    <aside class="controls">
      <div class="control-settings">
        <section class="panel">
          <h2>起终点设置</h2>
          <div class="field endpoint-field">
            <label for="from-input">起运地</label>
            <input id="from-input" role="combobox" aria-autocomplete="list" aria-expanded="false"
              aria-controls="from-options" autocomplete="off" spellcheck="false"
              value="深圳（CNSZX）" data-node-id="CNSZX" placeholder="例如 深圳、盐田港、SZX" />
            <div class="endpoint-dropdown" hidden>
              <div id="from-options" role="listbox" aria-label="起运地候选"></div>
              <div class="endpoint-message" aria-hidden="true"></div>
            </div>
            <span class="endpoint-status" role="status"></span>
          </div>
          <div class="field endpoint-field">
            <label for="to-input">目的地</label>
            <input id="to-input" role="combobox" aria-autocomplete="list" aria-expanded="false"
              aria-controls="to-options" autocomplete="off" spellcheck="false"
              value="阿姆斯特丹（NLAMS）" data-node-id="NLAMS" placeholder="例如 阿姆斯特丹、迪拜、NLAMS" />
            <div class="endpoint-dropdown" hidden>
              <div id="to-options" role="listbox" aria-label="目的地候选"></div>
              <div class="endpoint-message" aria-hidden="true"></div>
            </div>
            <span class="endpoint-status" role="status"></span>
          </div>

          <div class="quick-presets">
            <button type="button" class="preset-btn"><span data-from="CNSZX">深圳</span> → <span data-to="NLAMS">阿姆斯特丹</span></button>
            <button type="button" class="preset-btn"><span data-from="CNSZX">深圳</span> → <span data-to="AEDXB">迪拜</span></button>
            <button type="button" class="preset-btn"><span data-from="CNSZX">深圳</span> → <span data-to="SARUH">利雅得</span></button>
            <button type="button" class="preset-btn"><span data-from="CNSZX">深圳</span> → <span data-to="MXMEX">墨西哥城</span></button>
          </div>
        </section>

        <section class="panel">
          <h2>运输方式</h2>
          <div class="checks">
            <label><input type="checkbox" name="mode" value="sea" checked /> 海运 Sea</label>
            <label><input type="checkbox" name="mode" value="air" checked /> 空运 Air</label>
            <label><input type="checkbox" name="mode" value="rail" checked /> 铁路 Rail</label>
            <label><input type="checkbox" name="mode" value="road" checked /> 公路 Road</label>
          </div>
        </section>

        <section class="panel">
          <h2>咽喉 / 空域受阻模拟 (Avoid)</h2>
          <div id="chokepoint-list" class="chokepoint-list"></div>
        </section>
      </div>

      <div class="actions">
        <button id="run-btn" type="button" class="primary-btn">计算多式联运路径</button>
        <button id="compare-btn" type="button" class="secondary-btn">基线 vs 绕行对比</button>
      </div>
    </aside>

    <section class="workspace">
      <div id="map-panel" class="map-panel" data-view="routes">
        <div class="map-heading">
          <div class="map-view-switch" role="group" aria-label="地图视图">
            <button id="route-view-btn" class="map-btn" type="button" aria-pressed="true">路径评估</button>
            <button id="graph-view-btn" class="map-btn" type="button" aria-pressed="false">节点图谱</button>
          </div>
          <div class="map-header route-view">
            <span id="route-summary">选择起终点并计算路径</span>
            <div class="map-meta">
              <div class="map-legend" aria-label="图例">
                <span class="legend-item"><i class="swatch swatch-sea"></i>海运</span>
                <span class="legend-item"><i class="swatch swatch-air"></i>空运</span>
                <span class="legend-item"><i class="swatch swatch-rail"></i>铁路</span>
                <span class="legend-item"><i class="swatch swatch-road"></i>公路</span>
                <span class="legend-item compare-only"><i class="swatch swatch-baseline"></i>受阻基线</span>
                <span class="legend-item compare-only"><i class="node-dot node-blocked"></i>受阻咽喉</span>
              </div>
              <span id="cache-badge" class="cache-badge">—</span>
            </div>
          </div>
        </div>
        <label id="route-picker" class="route-picker route-view hidden">
          <span>路线</span>
          <select id="route-select"></select>
        </label>
        <div class="graph-toolbar graph-view">
          <div class="graph-search">
            <input id="graph-search" type="search" placeholder="搜索节点名称或代码" aria-label="搜索节点名称或代码" />
            <div id="graph-results" class="graph-results hidden" aria-label="节点搜索结果"></div>
          </div>
          <select id="graph-type" aria-label="节点类型">
            <option value="">全部类型</option>
            <option value="port">港口</option>
            <option value="airport">机场</option>
            <option value="city">城市</option>
            <option value="land">陆铁枢纽与口岸</option>
            <option value="passage">咽喉与空域</option>
          </select>
          <label><input type="checkbox" id="sea-layer" /> 海运航道</label>
          <label><input type="checkbox" id="land-layer" /> 陆铁走廊</label>
          <span id="graph-status" role="status"></span>
        </div>
        <div class="map-legend graph-legend graph-view" aria-label="节点图例">
          <span class="legend-item"><i class="node-dot node-port"></i>港口</span>
          <span class="legend-item"><i class="node-dot node-airport"></i>机场</span>
          <span class="legend-item"><i class="node-dot node-city"></i>城市</span>
          <span class="legend-item"><i class="node-dot node-land"></i>陆铁枢纽与口岸</span>
          <span class="legend-item"><i class="node-dot node-passage"></i>咽喉与空域</span>
        </div>
        <div class="map-stage">
          <div class="map-viewport">
            <canvas id="world-map"></canvas>
            <div class="map-controls" role="toolbar" aria-label="地图视图控制">
              <button id="zoom-in-btn" type="button" class="map-btn" title="放大">+</button>
              <button id="zoom-out-btn" type="button" class="map-btn" title="缩小">−</button>
              <button id="fit-route-btn" type="button" class="map-btn map-btn-wide route-view" title="缩放到当前选中路线" disabled>适配路线</button>
              <button id="reset-zoom-btn" type="button" class="map-btn map-btn-wide" title="恢复全球视图">全球</button>
              <span id="zoom-level" class="zoom-badge">1.0x</span>
              <button id="fullscreen-btn" type="button" class="map-btn map-btn-wide" aria-pressed="false">全屏</button>
            </div>
            <div id="map-tooltip" class="map-tooltip hidden"></div>
          </div>
          <article id="map-route-card" class="map-route-card route-view hidden" aria-label="选中路线详情">
            <div class="card-head">
              <span id="card-role" class="role-badge hidden"></span>
              <span id="card-mode" class="mode-tag"></span>
              <span id="card-likelihood" class="likelihood"></span>
              <button id="close-route-card" type="button" class="map-btn" aria-label="关闭路线详情">×</button>
            </div>
            <div id="card-gateways" class="gateways" role="status"></div>
            <div id="card-leg" class="card-leg hidden"></div>
            <div class="metrics">
              <div class="metric"><span>总里程</span><strong id="card-distance"></strong></div>
              <div class="metric"><span>预计时效</span><strong id="card-time"></strong></div>
              <div class="metric"><span>成本指数</span><strong id="card-cost"></strong></div>
            </div>
            <div id="card-compare-bar" class="card-compare-bar hidden"></div>
            <div id="card-chips" class="cp-chips hidden"></div>
            <details id="card-legs">
              <summary>查看全程分段</summary>
              <ul id="card-leg-list" class="legs"></ul>
            </details>
          </article>
          <article id="graph-card" class="map-route-card graph-card graph-view hidden" aria-label="节点详情">
            <div class="card-head">
              <strong id="graph-node-name"></strong>
              <button id="close-graph-card" class="map-btn" type="button" aria-label="关闭节点详情">×</button>
            </div>
            <div id="graph-node-details"></div>
            <div id="graph-endpoints" class="graph-endpoints">
              <button id="graph-set-from" class="map-btn" type="button">设为起点</button>
              <button id="graph-set-to" class="map-btn" type="button">设为终点</button>
            </div>
          </article>
        </div>
        <output id="route-node-info" class="route-node-info route-view" aria-label="路线节点">悬停或点击地图上的节点查看名称</output>
        <section id="compare-panel" class="compare-panel route-view hidden" aria-label="基线与绕行对比汇总">
          <div class="compare-header">
            <div class="compare-title-group">
              <strong class="compare-title">基线 vs 绕行对比</strong>
              <div id="compare-avoid-chips" class="compare-avoid-chips"></div>
              <span id="compare-headline" class="compare-headline"></span>
            </div>
            <div class="compare-controls">
              <div class="segmented" role="group" aria-label="对比视图">
                <button type="button" class="seg-btn active" data-compare-tab="summary" aria-pressed="true">方式汇总</button>
                <button type="button" class="seg-btn" data-compare-tab="routes" aria-pressed="false">路径明细</button>
              </div>
              <div class="segmented" role="group" aria-label="地图图层">
                <button type="button" class="seg-btn active" data-compare-layer="both" aria-pressed="true">基线+绕行</button>
                <button type="button" class="seg-btn" data-compare-layer="detour" aria-pressed="false">仅绕行</button>
                <button type="button" class="seg-btn" data-compare-layer="baseline" aria-pressed="false">仅基线</button>
              </div>
              <button id="compare-collapse-btn" type="button" class="map-btn map-btn-wide" aria-expanded="true">收起</button>
            </div>
          </div>
          <div id="compare-notice" class="compare-notice hidden"></div>
          <div id="compare-body" class="compare-body">
            <div id="compare-summary-wrap" class="compare-table-wrap">
              <table class="compare-table" aria-label="按运输方式对比汇总">
                <thead>
                  <tr>
                    <th>方式</th>
                    <th>状态</th>
                    <th>基线最优</th>
                    <th>绕行后最优</th>
                    <th class="num">时效变化</th>
                    <th class="num">里程变化</th>
                    <th class="num">成本变化</th>
                    <th class="actions-col">查看</th>
                  </tr>
                </thead>
                <tbody id="compare-summary-body"></tbody>
              </table>
            </div>
            <div id="compare-routes-wrap" class="compare-table-wrap hidden">
              <table class="compare-table compare-routes-table" aria-label="全部对比路径明细">
                <thead>
                  <tr>
                    <th>角色</th>
                    <th>方式</th>
                    <th>口岸与经由咽喉</th>
                    <th class="num">里程</th>
                    <th class="num">时效</th>
                    <th class="num">成本</th>
                    <th class="num">较基线变化</th>
                  </tr>
                </thead>
                <tbody id="compare-routes-body"></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
